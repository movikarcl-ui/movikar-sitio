<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviKar — Portal Chofer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FFFFFF; --surface:#F6F9F8; --surface-2:#EDF3F1;
    --ink:#16302C; --ink-dim:#5E7570; --line:#DCE6E3;
    --teal:#009688; --teal-dim:#E3F5F2; --teal-deep:#00695E;
    --coral:#E8542F; --coral-dim:#FFEEE7;
    --ok:#1F8F5C; --ok-dim:#E6F6EC;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  header{display:flex;align-items:center;gap:13px;padding:16px clamp(16px,4vw,32px);border-bottom:1px solid var(--line);}
  .brand-mark{width:48px;height:48px;border-radius:14px;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:32px;height:32px;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .brand-tag{font-size:11.5px;color:var(--teal-deep);font-weight:600;letter-spacing:.02em;}

  .wrap{max-width:460px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 60px;}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 3px rgba(22,48,44,0.05), 0 8px 24px rgba(22,48,44,0.04);}
  .card + .card{margin-top:16px;}

  h2{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 6px;color:var(--ink);}
  p.sub{font-size:13px;color:var(--ink-dim);margin:0 0 18px;line-height:1.5;}

  label{display:block;font-size:12px;color:var(--ink-dim);margin:0 0 6px;font-weight:500;}
  input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:11px 12px;color:var(--ink);font-size:14px;margin-bottom:14px;}
  input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:12px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:.15s;}
  .btn:hover{background:var(--teal-deep);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.coral{background:var(--coral);}
  .btn.coral:hover{background:#c94324;}

  .msg{font-size:13px;font-weight:600;margin-top:12px;padding:11px 13px;border-radius:8px;display:none;align-items:center;gap:8px;line-height:1.4;}
  .msg.ok{color:var(--ok);background:var(--ok-dim);border:1px solid var(--ok);display:flex;}
  .msg.err{color:var(--coral);background:var(--coral-dim);border:1px solid var(--coral);display:flex;}
  .msg.mock{color:var(--teal-deep);background:var(--teal-dim);border:1px solid var(--teal);display:flex;font-family:'JetBrains Mono',monospace;letter-spacing:1px;}

  .app-shell{display:none;}

  .chofer-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:12.5px;color:var(--ink-dim);}
  .logout-link{background:none;border:none;color:var(--ink-dim);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .toggle-info b{display:block;font-size:14px;color:var(--ink);}
  .toggle-info span{font-size:12px;color:var(--ink-dim);}
  .switch{position:relative;width:50px;height:28px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:28px;cursor:pointer;transition:.2s;}
  .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  input:checked + .slider{background:var(--ok);}
  input:checked + .slider:before{transform:translateX(22px);}

  .estado-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.03em;text-transform:uppercase;background:var(--teal-dim);color:var(--teal-deep);padding:4px 10px;border-radius:20px;margin-bottom:12px;}
  .traslado-row{font-size:13.5px;color:var(--ink);margin-bottom:6px;}
  .traslado-row b{font-weight:600;}
  .traslado-dim{font-size:12px;color:var(--ink-dim);}
  .empty-state{font-size:13px;color:var(--ink-dim);text-align:center;padding:20px 0;}
</style>
</head>
<body>

<header>
  <div class="brand-mark">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="29.6" rx="15" ry="1.5" fill="#EDF3F1"/>
      <path d="M6 26.6 L7.5 26.6 A4.5 4.5 0 0 1 16.5 26.6 L23.5 26.6 A4.5 4.5 0 0 1 32.5 26.6 L34 26.6 C36.3 24.3 35.3 19.7 31.5 17.5 C29.3 15 26.3 13 23 13 L16 13 C12.7 13 9.7 15 7.5 17.5 C4.7 19.7 3.7 24.3 6 26.6 Z" fill="#009688"/>
      <circle cx="12" cy="26.6" r="4" fill="#16302C"/><circle cx="12" cy="26.6" r="1.5" fill="#F6F9F8"/>
      <circle cx="28" cy="26.6" r="4" fill="#16302C"/><circle cx="28" cy="26.6" r="1.5" fill="#F6F9F8"/>
      <circle cx="30" cy="10.5" r="3.3" fill="#00695E"/>
      <path d="M28.3 10.5l1.1 1.1 2.1-2.4" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div>
    <div class="brand-name">MoviKar</div>
    <div class="brand-tag">PORTAL CHOFER</div>
  </div>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h2>Ingresa a tu portal</h2>
    <p class="sub">Escribe tu número de teléfono registrado y te enviamos un código de acceso.</p>

    <div id="pasoTelefono">
      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" placeholder="+56912345678">
      <button class="btn" id="btnSolicitar">Enviarme un código</button>
    </div>

    <div id="pasoCodigo" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
      <label for="codigo">Código de acceso</label>
      <input type="text" id="codigo" placeholder="123456" maxlength="6" style="text-align:center;letter-spacing:4px;font-family:'JetBrains Mono',monospace;">
      <button class="btn" id="btnVerificar">Confirmar</button>
    </div>

    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- APP -->
  <div class="app-shell" id="appShell">

    <div class="chofer-chip">
      <span id="choferNombre">—</span>
      <button class="logout-link" id="btnLogout">cerrar sesión</button>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div class="toggle-info">
          <b>Disponible para traslados</b>
          <span id="dispEstado">Desactivado</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="dispToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Traslado activo</h2>
      <div id="trasladoActivo">
        <div class="empty-state">No tienes ningún traslado asignado por ahora.</div>
      </div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = 'https://gcivybtcccaslyzkzgri.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IVjRfzdWhEO3yb5LkUz7pw_5IA-CxLW';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ORDEN_ESTADOS = ["agendado","asignado","en_camino","llegado","control_fotografico","completado"];
const ESTADO_LABEL = {
  agendado:"Agendado", asignado:"Asignado", en_camino:"En camino",
  llegado:"Llegado", control_fotografico:"Control fotográfico", completado:"Completado"
};

let choferId = localStorage.getItem('movikar_chofer_id');
let telefonoActual = '';
let watchId = null;
let refreshInterval = null;

function showMsg(id, text, tipo){
  const el = document.getElementById(id);
  el.className = 'msg ' + tipo;
  el.textContent = text;
}
function hideMsg(id){
  document.getElementById(id).className = 'msg';
}

async function invocar(fn, body){
  const { data, error } = await sb.functions.invoke(fn, { body });
  if(error) throw error;
  return data;
}

// ---------- LOGIN ----------
document.getElementById('btnSolicitar').addEventListener('click', async ()=>{
  const telefono = document.getElementById('telefono').value.trim();
  hideMsg('loginMsg');
  if(!telefono){
    showMsg('loginMsg', '⚠ Ingresa tu teléfono.', 'err');
    return;
  }
  telefonoActual = telefono;
  const btn = document.getElementById('btnSolicitar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    const data = await invocar('chofer-login', { modo: 'solicitar', telefono });
    btn.disabled = false; btn.textContent = 'Enviarme un código';
    if(!data.ok){
      showMsg('loginMsg', '⚠ ' + (data.motivo || 'No se pudo enviar el código.'), 'err');
      return;
    }
    document.getElementById('pasoCodigo').style.display = 'block';
    if(data.mock_codigo){
      // MOCK: mientras no haya WhatsApp Business conectado, el código se muestra aquí.
      showMsg('loginMsg', 'Código de prueba (mock): ' + data.mock_codigo, 'mock');
    } else {
      showMsg('loginMsg', '✓ Código enviado por WhatsApp.', 'ok');
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Enviarme un código';
    showMsg('loginMsg', '⚠ Error de conexión: ' + e.message, 'err');
  }
});

document.getElementById('btnVerificar').addEventListener('click', async ()=>{
  const codigo = document.getElementById('codigo').value.trim();
  hideMsg('loginMsg');
  if(!codigo){
    showMsg('loginMsg', '⚠ Ingresa el código.', 'err');
    return;
  }
  const btn = document.getElementById('btnVerificar');
  btn.disabled = true; btn.textContent = 'Verificando...';
  try{
    const data = await invocar('chofer-login', { modo: 'verificar', telefono: telefonoActual, codigo });
    btn.disabled = false; btn.textContent = 'Confirmar';
    if(!data.ok){
      showMsg('loginMsg', '⚠ ' + (data.motivo || 'Código inválido.'), 'err');
      return;
    }
    choferId = data.chofer_id;
    localStorage.setItem('movikar_chofer_id', choferId);
    localStorage.setItem('movikar_chofer_telefono', telefonoActual);
    iniciarApp();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Confirmar';
    showMsg('loginMsg', '⚠ Error de conexión: ' + e.message, 'err');
  }
});

document.getElementById('btnLogout').addEventListener('click', ()=>{
  pararGeolocalizacion();
  localStorage.removeItem('movikar_chofer_id');
  localStorage.removeItem('movikar_chofer_telefono');
  choferId = null;
  clearInterval(refreshInterval);
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('pasoCodigo').style.display = 'none';
  document.getElementById('telefono').value = '';
  document.getElementById('codigo').value = '';
  hideMsg('loginMsg');
});

// ---------- APP ----------
function iniciarApp(){
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  document.getElementById('choferNombre').textContent = localStorage.getItem('movikar_chofer_telefono') || 'Chofer';
  cargarTrasladoActivo();
  refreshInterval = setInterval(cargarTrasladoActivo, 20000);
}

// --- Toggle disponible + geolocalización ---
document.getElementById('dispToggle').addEventListener('change', async (e)=>{
  const activo = e.target.checked;
  document.getElementById('dispEstado').textContent = activo ? 'Activo — buscando ubicación...' : 'Desactivado';

  if(activo){
    if(!navigator.geolocation){
      showMsg('loginMsg', '⚠ Este navegador no soporta geolocalización.', 'err');
      e.target.checked = false;
      return;
    }
    watchId = navigator.geolocation.watchPosition(async (pos)=>{
      document.getElementById('dispEstado').textContent = 'Activo';
      try{
        await invocar('chofer-actualizar', {
          modo: 'set_disponible',
          chofer_id: choferId,
          disponible: true,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        });
      }catch(err){ console.error('No se pudo actualizar ubicación:', err); }
    }, (err)=>{
      document.getElementById('dispEstado').textContent = 'Sin permiso de ubicación';
      document.getElementById('dispToggle').checked = false;
    }, { enableHighAccuracy:true, maximumAge:15000 });
  } else {
    pararGeolocalizacion();
    try{
      await invocar('chofer-actualizar', { modo:'set_disponible', chofer_id: choferId, disponible: false });
    }catch(err){ console.error(err); }
  }
});

function pararGeolocalizacion(){
  if(watchId !== null){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
}

// --- Traslado activo ---
async function cargarTrasladoActivo(){
  if(!choferId) return;
  const { data, error } = await sb
    .from('traslados')
    .select('id, tipo, patente, marca, modelo, calle, numero, comuna, depto_casa, cliente_nombre, cliente_telefono, estado_retiro, estado_entrega, chofer_retiro_id, chofer_entrega_id')
    .or(`chofer_retiro_id.eq.${choferId},chofer_entrega_id.eq.${choferId}`)
    .order('created_at', { ascending:false })
    .limit(5);

  const cont = document.getElementById('trasladoActivo');
  if(error || !data || data.length === 0){
    cont.innerHTML = '<div class="empty-state">No tienes ningún traslado asignado por ahora.</div>';
    return;
  }

  // Nos quedamos con el primero que aún no esté completado/cancelado en su etapa asignada
  const activo = data.find(t=>{
    const esRetiro = t.chofer_retiro_id === choferId;
    const estado = esRetiro ? t.estado_retiro : t.estado_entrega;
    return estado && estado !== 'completado' && estado !== 'cancelado';
  });

  if(!activo){
    cont.innerHTML = '<div class="empty-state">No tienes ningún traslado asignado por ahora.</div>';
    return;
  }

  const etapa = activo.chofer_retiro_id === choferId ? 'retiro' : 'entrega';
  const estadoActual = etapa === 'retiro' ? activo.estado_retiro : activo.estado_entrega;
  const idx = ORDEN_ESTADOS.indexOf(estadoActual);
  const esUltimo = idx === -1 || idx === ORDEN_ESTADOS.length - 1;
  const direccion = `${activo.calle} ${activo.numero}${activo.depto_casa ? ', '+activo.depto_casa : ''}, ${activo.comuna}`;
  const wazeUrl = `https://waze.com/ul?q=${encodeURIComponent(direccion)}&navigate=yes`;

  cont.innerHTML = `
    <span class="estado-badge">${etapa === 'retiro' ? 'Retiro' : 'Entrega'} · ${ESTADO_LABEL[estadoActual] || estadoActual}</span>
    <div class="traslado-row"><b>${activo.patente}</b> ${[activo.marca, activo.modelo].filter(Boolean).join(' ')}</div>
    <div class="traslado-row">${direccion} · <a href="${wazeUrl}" target="_blank" rel="noopener" style="color:var(--teal-deep);">Ver en Waze ↗</a></div>
    <div class="traslado-dim">Cliente: ${activo.cliente_nombre} · ${activo.cliente_telefono}</div>
    <button class="btn" style="margin-top:16px;" id="btnAvanzar" ${esUltimo ? 'disabled' : ''}>
      ${esUltimo ? 'Traslado completado' : 'Avanzar a: ' + (ESTADO_LABEL[ORDEN_ESTADOS[idx+1]] || '')}
    </button>
  `;

  const btn = document.getElementById('btnAvanzar');
  if(btn && !esUltimo){
    btn.addEventListener('click', async ()=>{
      btn.disabled = true; btn.textContent = 'Actualizando...';
      try{
        await invocar('chofer-actualizar', { modo:'avanzar_estado', chofer_id: choferId, traslado_id: activo.id, etapa });
        await cargarTrasladoActivo();
      }catch(e){
        console.error(e);
        btn.disabled = false;
      }
    });
  }
}

// ---------- INIT ----------
if(choferId){
  iniciarApp();
}
</script>

</body>
</html>
